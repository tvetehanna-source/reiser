    <style>
        *{

            #toppfelt{
                width: 100vw;

            #linkefelt{

             body{

             #hovedfelt{

             }

             }

             #hovedfelt > p {
             font-size: 20px;
             color: rgb(246,248,145);
             margin-bottom: 40px;
             }

             .kolonne {
             display: flex;
             gap: 20px;
             justify-content: center;
             }

             .boks {
             width: 250px;
             height: 150px;
             background-color: rgb(246,248,145);
             color: coral;
             display: flex;
             align-items: center;
             justify-content: center;
             font-size: 25px;
             font-weight: bold;
             border-radius: 25px;
             overflow: hidden;
             }

              .boks img {
             width: 80%;
             height: 80%;
             object-fit: cover;
             border-radius: 15px;
             transition: 0.5s;
             }
             
             .boks:hover img {
             transform: scale(1.1);
             }
             

            

             .knapp {
             display: inline-block;
             margin-top: 40px;
             padding: 15px 30px;
             background-color: rgb(246,248,145);
             color: coral;
             text-decoration: none;
             font-size: 18px;
             font-weight: bold;
             }

             @media screen and (max-width: 1000px){

    /* Coral linkefelt forsvinner */
    #linkefelt {
        display: none;
    }

    /* Toppfelt tilpasses mobilen */
    #toppfelt {
        width: 100%;
        height: 80px;
        font-size: 40px;
    }

    #venstretopp {
        width: 70px;
        height: 80px;
    }

    #venstretopp img {
        height: 65px;
    }

    #midttopp {
        width: calc(100% - 140px);
        height: 80px;
    }

    #hoyeretopp {
        width: 70px;
        height: 80px;
        font-size: 35px;
    }

    /* Hovedfelt */
    #hovedfelt {
        box-sizing: border-box;
        width: 100%;
        min-height: 600px;
        padding: 15px;
    }

    /* Overskrift */
    #hovedfelt h1 {
        font-size: 40px;
        margin: 15px 0;
    }

    #hovedfelt > p {
        font-size: 17px;
        margin-bottom: 30px;
    }

    /* Boksene legges under hverandre */
    .kolonne {
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    .boks {
        width: 85vw;
        max-width: 300px;
        height: 170px;
    }

    /* Knappen tilpasses skjermen */
    .knapp {
        display: block;
        width: fit-content;
        margin: 40px auto 20px auto;
        padding: 15px 20px;
    }
}
